name: validate-skills

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate skill structure
        run: python3 scripts/validate-skills.py
      - name: Validate regression fixtures
        run: python3 scripts/validate-regressions.py
      - name: Smoke test pack distribution
        run: python3 scripts/smoke-test-distribution.py
